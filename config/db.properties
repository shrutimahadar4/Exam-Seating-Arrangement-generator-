# ========================================================
# Exam Sitting Arrangement Generator - Configuration
# ========================================================

# Database Mode: 'mysql' or 'sqlite'
# If set to 'mysql' and MySQL is unreachable, 'db.auto_fallback=true' 
# will gracefully fall back to local SQLite so the system never crashes.
db.type=mysql
db.auto_fallback=true

# MySQL Database Settings
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=exam_seating_db
db.mysql.username=root
db.mysql.password=

# SQLite Local Database File (Stored in project directory)
db.sqlite.file=exam_seating.db

# Web Server Port
server.port=8080
